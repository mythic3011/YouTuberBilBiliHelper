name: Docker Build & Push

on:
  push:
    branches: [master, main]
    tags:
      - "v*"
  pull_request:
    branches: [master, main]

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to Container Registry
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=pr
            type=semver,pattern={{version}}
            type=semver,pattern={{major}}.{{minor}}
            type=sha

      - name: Build and push Go API
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  test-image:
    needs: [build]
    runs-on: ubuntu-latest
    if: github.event_name == 'pull_request'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Test Go API Docker image
        run: |
          set -eu
          trap 'docker compose down -v' EXIT
          # Validate the default, unauthenticated local development mode.
          docker compose up -d --build
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 http://127.0.0.1:8001/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs
            exit 1
          fi

          # A localhost reverse proxy must NOT bypass enabled API key auth.
          docker compose down -v
          export API_KEY_ENABLED=true
          export API_KEYS=ci-smoke-secret
          docker compose up -d
          healthy=0
          for i in $(seq 1 30); do
            if curl -fsS --max-time 3 -H "X-API-Key: $API_KEYS"                 http://127.0.0.1:8001/health >/dev/null; then
              healthy=1
              break
            fi
            sleep 2
          done
          if [ "$healthy" -ne 1 ]; then
            docker compose ps
            docker compose logs
            exit 1
          fi
          status="$(curl -sS -o /dev/null -w '%{http_code}' http://127.0.0.1:8001/health)"
          test "$status" = "401"
          docker compose exec -T video-api /app/healthcheck.sh
          docker compose ps
