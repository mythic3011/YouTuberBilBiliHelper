name: Go CI

on:
  push:
    branches: [master, main, develop]
  pull_request:
    branches: [master, main, develop]

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    services:
      redis:
        image: redis:7-alpine
        ports: ["6379:6379"]
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - name: Install Go version from go.mod
        uses: actions/setup-go@v6
        with:
          go-version-file: go.mod
          cache-dependency-path: go.sum
      - name: Verify dependencies
        run: |
          go mod download
          go mod verify
      - name: Build
        run: go build ./...
      - name: Static analysis
        run: go vet ./...
      - name: Unit and integration tests (race detector)
        env:
          REDIS_HOST: 127.0.0.1
          REDIS_PORT: "6379"
          ENVIRONMENT: testing
        run: go test -race -count=1 ./...
