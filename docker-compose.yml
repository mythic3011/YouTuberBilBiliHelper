services:
  video-api:
    build: .
    image: video-streaming-api:local
    ports:
      - "${BIND_ADDRESS:-127.0.0.1}:${PORT:-8001}:8001"
    environment:
      PORT: "8001"
      ENVIRONMENT: ${ENVIRONMENT:-production}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      REDIS_HOST: redis
      REDIS_PORT: "6379"
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
      REDIS_DB: "0"
      VIDEO_INFO_TTL: ${VIDEO_INFO_TTL:-1h}
      STREAM_URL_TTL: ${STREAM_URL_TTL:-5m}
      SMART_PROXY_ENABLED: ${SMART_PROXY_ENABLED:-true}
      PROXY_COUNTRIES: ${PROXY_COUNTRIES:-CN}
      DEFAULT_STREAM_MODE: ${DEFAULT_STREAM_MODE:-direct}
      RATE_LIMIT_ENABLED: ${RATE_LIMIT_ENABLED:-true}
      RATE_LIMIT_MAX_REQUESTS: ${RATE_LIMIT_MAX_REQUESTS:-100}
      RATE_LIMIT_WINDOW: ${RATE_LIMIT_WINDOW:-60}
      RATE_LIMIT_BY_IP: ${RATE_LIMIT_BY_IP:-true}
      API_KEY_ENABLED: ${API_KEY_ENABLED:-false}
      API_KEYS: ${API_KEYS:-}
      API_KEY_HEADER: ${API_KEY_HEADER:-X-API-Key}
      API_KEY_EXEMPT_IPS: ${API_KEY_EXEMPT_IPS:-127.0.0.1,::1}
      CORS_ALLOWED_ORIGINS: ${CORS_ALLOWED_ORIGINS:-}
      CORS_ALLOW_CREDENTIALS: ${CORS_ALLOW_CREDENTIALS:-false}
      ENABLE_IP_CONTROL: ${ENABLE_IP_CONTROL:-false}
      IP_ALLOWLIST: ${IP_ALLOWLIST:-}
      IP_BLOCKLIST: ${IP_BLOCKLIST:-}
      ENABLE_HSTS: ${ENABLE_HSTS:-true}
      TZ: ${TZ:-Asia/Hong_Kong}
    volumes:
      # Managed volumes avoid root-owned host bind mount failures for UID 1000.
      - api_downloads:/app/downloads
      - api_logs:/app/logs
      - ./config:/app/config:ro
    depends_on:
      redis:
        condition: service_healthy
    restart: unless-stopped
    networks: [video-api-network]
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://localhost:8001/api/v2/system/health"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 15s

  redis:
    image: redis:7-alpine
    # Redis is not exposed on the host; optional authentication for Compose.
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD:-}
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        set -- redis-server --appendonly yes --appendfsync everysec \
          --maxmemory 256mb --maxmemory-policy allkeys-lru
        if [ -n "$$REDIS_PASSWORD" ]; then
          set -- "$$@" --requirepass "$$REDIS_PASSWORD"
        fi
        exec "$$@"
    volumes:
      - redis_data:/data
    restart: unless-stopped
    networks: [video-api-network]
    healthcheck:
      test: ["CMD-SHELL", "REDISCLI_AUTH=\"$$REDIS_PASSWORD\" redis-cli ping | grep -qx PONG"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  redis_data:
  api_downloads:
  api_logs:

networks:
  video-api-network:
    driver: bridge
